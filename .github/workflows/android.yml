# Сборка APK на GitHub: при каждом push / PR и вручную (вкладка Actions → Run workflow).
# Готовый APK — в разделе Artifacts у запуска (хранится 30 дней).
name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle (кэш)
        uses: gradle/actions/setup-gradle@v4

      - name: Сборка и тесты
        run: ./gradlew assembleDebug test --warning-mode all

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: uchet-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Отчёт тестов (при ошибке)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.sha }}
          path: app/build/reports/tests/
          if-no-files-found: ignore
