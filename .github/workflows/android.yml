# Сборка APK на GitHub: при каждом push / PR и вручную (вкладка Actions → Run workflow).
# Готовый APK — в разделе Artifacts у запуска (хранится 30 дней).
#
# Обновление из программы: при push в рабочую ветку создаётся релиз "build-<номер>"
# с APK — приложение находит его в «Настройки → Обновление». Релиз делается, только
# если задан секрет UCHET_KEYSTORE_B64 (ключ подписи в base64): APK, подписанный
# случайным ключом GitHub, не встанет поверх установленного приложения.
# Секреты: Settings → Secrets and variables → Actions:
#   UCHET_KEYSTORE_B64        — base64 файла .keystore (обязательно)
#   UCHET_KEYSTORE_PASSWORD, UCHET_KEY_ALIAS, UCHET_KEY_PASSWORD — если ключ не
#   стандартный debug.keystore (там android / androiddebugkey / android).
name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # создание релиза
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # номер сборки = число коммитов (см. app/build.gradle.kts)

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle (кэш)
        uses: gradle/actions/setup-gradle@v4

      - name: Ключ подписи (из секрета)
        env:
          KEYSTORE_B64: ${{ secrets.UCHET_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/uchet.keystore"
            echo "UCHET_KEYSTORE_FILE=$RUNNER_TEMP/uchet.keystore" >> "$GITHUB_ENV"
            echo "Ключ подписи задан."
          else
            echo "::warning::Секрет UCHET_KEYSTORE_B64 не задан: APK подписан временным ключом, релиз для обновления не создаётся."
          fi

      - name: Сборка и тесты
        env:
          UCHET_KEYSTORE_PASSWORD: ${{ secrets.UCHET_KEYSTORE_PASSWORD }}
          UCHET_KEY_ALIAS: ${{ secrets.UCHET_KEY_ALIAS }}
          UCHET_KEY_PASSWORD: ${{ secrets.UCHET_KEY_PASSWORD }}
        run: ./gradlew assembleDebug test --warning-mode all

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: uchet-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Релиз для обновления из программы
        if: >-
          github.event_name == 'push' && env.UCHET_KEYSTORE_FILE != '' &&
          (github.ref == 'refs/heads/arena/01a08f9c-uchet' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(git rev-list --count HEAD)
          if gh release view "build-$code" > /dev/null 2>&1; then
            echo "Релиз build-$code уже есть."
            exit 0
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "uchet-$code.apk"
          git log -1 --format=%B | sed '/^Co-Authored-By/d' > notes.txt
          gh release create "build-$code" "uchet-$code.apk" \
            --title "Сборка $code" --notes-file notes.txt --target "$GITHUB_SHA" --latest

      - name: Отчёт тестов (при ошибке)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.sha }}
          path: app/build/reports/tests/
          if-no-files-found: ignore
